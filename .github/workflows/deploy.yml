# Déploiement automatique à chaque push sur main :
# image Docker → Docker Hub → mise à jour du conteneur sur le VPS (via SSH) → vérification.
# Réglages à faire une fois dans GitHub (Settings → Secrets and variables → Actions) : voir README.

name: Deploy

on:
  push:
    branches: [main]
    # Seulement si ce qui part dans l'image (ou le déploiement) a changé.
    paths:
      - server.js
      - src/**
      - public/**
      - Dockerfile
      - .dockerignore
      - package.json
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:   # bouton « Run workflow » pour redéployer à la main

# Un seul déploiement à la fois ; un push pendant un déploiement attend son tour.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: julesgrateau/kanji-keiko

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest = ce que le VPS utilise ; le tag au nom du commit permet de revenir en arrière.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mettre à jour le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DIR: ${{ secrets.VPS_DIR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" bash -s -- "$VPS_DIR" kanji-keiko < deploy/update-vps.sh
